# Explicit, so image and volume names do not depend on the directory this is
# checked out into. Renaming the checkout no longer silently orphans the caches.
name: thatapp

services:
  app:
    build:
      context: .
      target: dev
    ports:
      - "${THAT_PORT:-8080}:8080"
    # As the host user, so ./data/thatapp.db and anything written into the
    # bind-mounted tree belong to whoever runs `make`, not to root. The Makefile
    # exports both from `id -u`/`id -g`; driving Compose directly takes them from
    # .env instead.
    #
    # Deliberately no default. A wrong UID does not fail cleanly — it half-works,
    # then dies deep inside npm or the Go build cache with EACCES on a file some
    # other UID created, which reads like a tooling bug rather than a config one.
    # Refusing to start names the knob to turn.
    #
    # Upgrading from the named-volume layout? The old go-mod-cache and
    # go-build-cache are root-owned 0755 and will NOT become writable on their
    # own — run `make down` once, then `make up`. That is safe now: the database
    # is no longer in a volume for `down -v` to take.
    user: "${THAT_UID:?unset - run through make, or add THAT_UID/THAT_GID to .env (see .env.example)}:${THAT_GID:?unset - see .env.example}"
    volumes:
      - .:/src
      - go-mod-cache:/cache/go-mod
      - go-build-cache:/cache/go-build
      # A bind mount, deliberately, not a named volume: `make down` runs
      # `down -v`, which drops every named volume in the project. That destroyed
      # the owner's real Jira instance and pins once already (#73).
      - ./data:/data
    environment:
      THAT_ADDR: ":8080"
      THAT_DB_PATH: /data/thatapp.db
      THAT_SECRET_KEY: "${THAT_SECRET_KEY:-}"
      THAT_TIMEZONE: "${THAT_TIMEZONE:-Europe/Amsterdam}"
    command: go run -tags dev ./cmd/server
    depends_on:
      web:
        condition: service_healthy
    # "app" collides with the .app gTLD, which sits on Chromium and Firefox's
    # built-in HSTS preload list, so a browser silently upgrades http://app to
    # https and breaks the Playwright rig. that-app is a second, unambiguous name
    # on the same network for the rig to target instead. See docker-compose.yml
    # `playwright` service and .claude/e2e/playwright.config.ts.
    networks:
      default:
        aliases:
          - that-app
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 3s
      timeout: 3s
      retries: 20
      # go run compiles before it listens; a cold start is slow.
      start_period: 60s

  web:
    build:
      context: .
      target: webdev
    working_dir: /src/web
    # Same reasoning as `app`: this service writes web/dist and node_modules into
    # the bind-mounted tree, and root-owned build output there needs sudo to clear.
    user: "${THAT_UID:?unset - run through make, or add THAT_UID/THAT_GID to .env (see .env.example)}:${THAT_GID:?unset - see .env.example}"
    volumes:
      - .:/src
      - web-node-modules:/src/web/node_modules
      - web-npm-cache:/cache/npm
    # A fresh clone has neither node_modules nor web/dist, so `docker compose up`
    # has to install and build once before watching. The marker file reports that
    # first build to the healthcheck, which is what holds the app back from
    # serving an empty web/dist.
    command: sh -c 'npm ci && npm run build && touch /tmp/web-built && npm run watch'
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/web-built"]
      interval: 2s
      timeout: 5s
      retries: 3
      start_period: 300s

  lint:
    image: golangci/golangci-lint:v2.12.2
    working_dir: /src
    entrypoint: []
    volumes:
      - .:/src
      # Its own module cache, not the one `app` uses. This image runs as root, and
      # a root-owned module written into a shared cache is one the non-root `app`
      # cannot then update. Costs one extra download; saves an intermittent
      # permission failure that would look like a Go bug.
      - lint-go-mod-cache:/go/pkg/mod
      - golangci-cache:/root/.cache

  playwright:
    profiles: [e2e]
    build:
      context: .claude/e2e
    working_dir: /e2e
    # Playwright's own Docker guidance: Chromium's renderer dies on the default
    # 64MB /dev/shm, and the runner leaves browser processes to reap.
    ipc: host
    init: true
    volumes:
      - ./.claude/e2e:/e2e
      - playwright-node-modules:/e2e/node_modules
      - playwright-npm-cache:/root/.npm
    environment:
      THAT_BASE_URL: "http://that-app:8080"
      # playwright.config.ts branches on CI for forbidOnly, retries and the
      # reporter. `compose run` forwards nothing from the host environment, so
      # without this the container never sees the CI runner's CI=true.
      CI: "${CI:-}"
    depends_on:
      app:
        condition: service_healthy

volumes:
  go-mod-cache:
  go-build-cache:
  lint-go-mod-cache:
  golangci-cache:
  web-node-modules:
  web-npm-cache:
  playwright-node-modules:
  playwright-npm-cache:
