<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; }
    .wd { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif; }
    .tnum { font-variant-numeric: tabular-nums; }
    .wd[data-mode="light"] {
      --surface: oklch(0.975 0.006 70);
      --raised: oklch(0.996 0.003 70);
      --ink: oklch(0.20 0.008 70);
      --ink-muted: oklch(0.48 0.008 70);
      --ink-faint: oklch(0.62 0.007 70);
      --edge: oklch(0.915 0.006 70);
      --rail: oklch(0.215 0.018 55);
      --rail-ink: oklch(0.965 0.004 70);
      --rail-muted: oklch(0.68 0.012 60);
      --rail-active: oklch(0.30 0.022 55);
      --primary: oklch(0.52 0.19 330);
      --primary-ink: oklch(0.99 0.004 70);
      --primary-rail: oklch(0.66 0.19 330);
      --primary-rail-ink: oklch(0.17 0.02 330);
      --running: oklch(0.50 0.15 150);
      --pending: oklch(0.52 0.13 75);
      --failed: oklch(0.51 0.19 25);
      --running-rail: oklch(0.74 0.15 150);
      --pending-rail: oklch(0.80 0.13 85);
      --failed-rail: oklch(0.72 0.17 25);
      --state-ink: oklch(0.99 0.004 70);
      --state-rail-ink: oklch(0.15 0.012 60);
      --i1: oklch(0.60 0.13 265);
      --i2: oklch(0.60 0.13 175);
      --i1-rail: oklch(0.70 0.13 265);
      --i2-rail: oklch(0.70 0.13 175);
      --shadow: 0 1px 2px oklch(0.35 0.04 60 / 0.05), 0 10px 26px -14px oklch(0.35 0.04 60 / 0.20);
    }
    .wd[data-mode="dark"] {
      --surface: oklch(0.165 0.008 60);
      --raised: oklch(0.215 0.010 60);
      --ink: oklch(0.955 0.004 70);
      --ink-muted: oklch(0.70 0.010 65);
      --ink-faint: oklch(0.55 0.010 65);
      --edge: oklch(0.285 0.010 60);
      --rail: oklch(0.125 0.008 55);
      --rail-ink: oklch(0.955 0.004 70);
      --rail-muted: oklch(0.64 0.012 60);
      --rail-active: oklch(0.225 0.015 55);
      --primary: oklch(0.70 0.17 330);
      --primary-ink: oklch(0.16 0.02 330);
      --primary-rail: oklch(0.70 0.17 330);
      --primary-rail-ink: oklch(0.16 0.02 330);
      --running: oklch(0.74 0.14 150);
      --pending: oklch(0.80 0.12 85);
      --failed: oklch(0.72 0.17 25);
      --running-rail: oklch(0.74 0.15 150);
      --pending-rail: oklch(0.80 0.13 85);
      --failed-rail: oklch(0.72 0.17 25);
      --state-ink: oklch(0.16 0.01 60);
      --state-rail-ink: oklch(0.15 0.012 60);
      --i1: oklch(0.72 0.12 265);
      --i2: oklch(0.72 0.12 175);
      --i1-rail: oklch(0.70 0.13 265);
      --i2-rail: oklch(0.70 0.13 175);
      --shadow: 0 1px 2px oklch(0 0 0 / 0.35), 0 10px 26px -14px oklch(0 0 0 / 0.6);
    }
    a { color: var(--primary); }
    a:hover { color: var(--ink); }
    .label { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 700; }
    .meta { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 700; }
    .key { font-size: 12px; font-weight: 700; letter-spacing: 0.03em; text-decoration: none; }
  </style>
</helmet>
<div class="wd" data-mode="{{mode}}" style="width: 880px; min-height: 300px; background: var(--surface); color: var(--ink); padding: 38px">
  <div style="border-radius: 16px; background: var(--raised); box-shadow: var(--shadow); padding: 2px 22px">
        <div style="display: flex; align-items: center; gap: 18px; padding: 15px 0">
          <a href="#" class="key tnum" style="width: 76px; flex-shrink: 0; color: var(--running)">RID-412</a>
          <span style="flex: 1; min-width: 0; font-size: 15px; letter-spacing: -0.01em">Retry a worklog push that failed mid-fan-out</span>
          <span style="flex-shrink: 0; font-size: 12px; color: var(--ink-muted)">In Progress</span>
          <span class="tnum" style="flex-shrink: 0; width: 62px; text-align: right; font-size: 17px; font-weight: 700; color: var(--running)">01:12</span>
          <button aria-label="Stop timer" style="cursor: pointer; display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; flex-shrink: 0; border-radius: 999px; border: none; background: var(--running); color: var(--state-ink)"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1.5"></rect></svg></button>
        </div>
        <div style="height: 1px; background: var(--edge)"></div>
        <div style="display: flex; align-items: center; gap: 18px; padding: 15px 0">
          <a href="#" class="key tnum" style="width: 76px; flex-shrink: 0; color: var(--ink-muted)">RID-398</a>
          <span style="flex: 1; min-width: 0; font-size: 15px; letter-spacing: -0.01em">Settings form keeps stale state on reuse</span>
          <span style="flex-shrink: 0; font-size: 12px; color: var(--ink-muted)">In Review</span>
          <span style="display: inline-flex; align-items: center; gap: 8px; flex-shrink: 0"><input value="00:30" aria-label="Duration to add" style="font: inherit; font-variant-numeric: tabular-nums; width: 74px; height: 38px; text-align: right; padding: 0 10px; border-radius: 9px; border: 1px solid var(--primary); background: var(--raised); color: var(--ink); font-size: 16px; font-weight: 500"><span style="font-size: 12px; color: var(--ink-muted); width: 92px">Enter adds<br>to 02:30</span></span>
          <button aria-label="Start timer" style="cursor: pointer; display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; flex-shrink: 0; border-radius: 999px; border: 1px solid var(--edge); background: transparent; color: var(--ink-muted)"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"></path></svg></button>
        </div>
        <div style="height: 1px; background: var(--edge)"></div>
        <div style="display: flex; align-items: center; gap: 18px; padding: 15px 0">
          <a href="#" class="key tnum" style="width: 76px; flex-shrink: 0; color: var(--ink-muted)">RID-355</a>
          <span style="flex: 1; min-width: 0; font-size: 15px; letter-spacing: -0.01em">Timer survives a page reload</span>
          <span style="flex-shrink: 0; font-size: 12px; color: var(--ink-muted)">To Do</span>
          <span class="tnum" style="flex-shrink: 0; width: 62px; text-align: right; font-size: 17px; color: var(--ink-muted)">00:00</span>
          <button aria-label="Start timer" style="cursor: pointer; display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; flex-shrink: 0; border-radius: 999px; border: 1px solid var(--edge); background: transparent; color: var(--ink-muted)"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"></path></svg></button>
        </div>
        </div>
</div>
</x-dc>
<script data-dc-script data-props='{"mode":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":880,"height":300}}'>
class Component extends DCLogic {
  renderVals() {
    return { mode: this.props.mode ?? 'light' };
  }
}
</script>
</body>
</html>
