<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ThatApp</title>
    <link rel="preload" href="/fonts/chivo-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link
      rel="preload"
      href="/fonts/chivo-mono-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      /* An absent data-theme attribute is the auto state, so a failed
         localStorage read lands on following the OS rather than on a guess.
         The order here decides only the no-preference case, and there dark
         wins; a stored preference beats it and so does an OS that expresses
         one. Inlined here, not in styles.css, because the build's minifier
         reorders a two-value color-scheme and reverses that decision — and
         inline survives untouched only ahead of app.css, so that a stored
         preference's [data-theme] override in the stylesheet still wins on
         equal specificity. */
      :root {
        color-scheme: dark light;
      }
    </style>
    <link rel="stylesheet" href="/app.css" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icons/icon.svg" />
    <script type="module" src="/app.js"></script>
    <script>
      // Duplicates two lines of src/theme.ts on purpose: this must run before
      // the module graph loads, so it cannot import them. It only ever
      // overrides — an absent attribute is the auto state, so doing nothing
      // when storage throws is the correct behaviour, not a swallowed bug.
      try {
        let stored = localStorage.getItem("theme");
        if (stored === "light" || stored === "dark") {
          document.documentElement.dataset.theme = stored;
        }
      } catch {}
    </script>
  </head>
  <body class="bg-surface text-ink font-sans text-base tracking-[-0.011em]">
    <!--
      h-screen only from md: up: below it the grid is one column and rows
      still size to their content (min-h-screen, as before), so the page
      itself scrolls and the rail travels with it. At and above md: the row
      is fixed to the screen and the two children below split its overflow
      instead, which is the point of this shell.
    -->
    <div class="grid min-h-screen grid-cols-1 md:h-screen md:grid-cols-[216px_minmax(0,1fr)]">
      <!--
        The rail is the instrument, not a menu: the thing you glance at sits in
        the same place whatever view you are on. It is dark in both themes and
        does not invert.

        This is the first-run board rendered literally. Its regions go live
        later — the total and the split in #7, the timer in #8, the unpushed
        count and Push in #9 — and until then each states its resting condition
        in words rather than vanishing. Nothing shows a value that would be
        wrong once the data exists: with no time entries possible yet the total
        really is zero, there really is nothing to split, no timer is running,
        and there is nothing to push.
      -->
      <aside
        class="that-rail bg-rail text-rail-ink flex flex-col gap-[26px] px-3.5 py-[22px] md:overflow-y-auto"
      >
        <div class="flex items-center gap-2">
          <h1 class="text-primary-rail flex-1 text-xs font-bold tracking-[0.16em] uppercase">
            ThatApp
          </h1>
          <!-- #89: Settings is a control, not a destination. The gear is the
               prototype's #p-gear at 1.7 stroke, not the set's 1.9 — at 1.9 its
               teeth close up at this size. The one stroke exception in the set. -->
          <button
            id="settings-cog"
            type="button"
            aria-label="Settings"
            class="text-rail-muted hover:bg-hover-rail hover:text-rail-ink focus-visible:text-rail-ink flex size-[34px] shrink-0 cursor-pointer items-center justify-center rounded-sm"
          >
            <svg
              width="17"
              height="17"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="M9.62 5.10 L10.33 2.55 L13.67 2.55 L14.38 5.10 A 7.30 7.30 0 0 1 15.20 5.44 L17.51 4.14 L19.86 6.49 L18.56 8.80 A 7.30 7.30 0 0 1 18.90 9.62 L21.45 10.33 L21.45 13.67 L18.90 14.38 A 7.30 7.30 0 0 1 18.56 15.20 L19.86 17.51 L17.51 19.86 L15.20 18.56 A 7.30 7.30 0 0 1 14.38 18.90 L13.67 21.45 L10.33 21.45 L9.62 18.90 A 7.30 7.30 0 0 1 8.80 18.56 L6.49 19.86 L4.14 17.51 L5.44 15.20 A 7.30 7.30 0 0 1 5.10 14.38 L2.55 13.67 L2.55 10.33 L5.10 9.62 A 7.30 7.30 0 0 1 5.44 8.80 L4.14 6.49 L6.49 4.14 L8.80 5.44 A 7.30 7.30 0 0 1 9.62 5.10 Z"
              />
              <circle cx="12" cy="12" r="3.3" />
            </svg>
          </button>
          <!-- popover in the markup, so it is hidden before that-tooltip registers. -->
          <that-tooltip for="settings-cog" anchor="right" popover="manual">Settings</that-tooltip>
        </div>

        <div class="flex flex-col gap-2">
          <!-- Which period the figure below describes. The rail used to mean
               "today" implicitly, which was unambiguous only while Today was the
               one view with time in it. #11 makes it follow the view, and this
               is what keeps the figure honest. -->
          <span
            id="rail-period"
            class="text-rail-muted text-xs font-bold tracking-[0.12em] uppercase"
            >Today</span
          >
          <div
            id="rail-total"
            class="that-tnum text-hero font-mono leading-[0.88] font-bold tracking-[-0.035em]"
          >
            0h 00m
          </div>
          <!-- #7 fills this with the split bar and a figure per instance. The
               resting line is inside it rather than replaced by it, so the bar
               is absent — not zero width — until there is something to divide. -->
          <div id="rail-split" class="flex flex-col gap-2">
            <span class="text-rail-muted text-base">Nothing to split yet</span>
          </div>

          <div class="bg-rail-active my-1 h-0.5 rounded-xs"></div>

          <!-- #8's rail.ts owns this region from here: the resting markup
               below is what it repaints back to when nothing is running, and
               what it replaces with the running line the moment something is. -->
          <div id="rail-timer" class="flex items-center gap-2">
            <span class="bg-rail-active size-[7px] shrink-0 rounded-full"></span>
            <span class="text-rail-muted text-base">No timer running</span>
          </div>

          <!-- The count of entries not yet pushed, and the control that pushes them. -->
          <span id="rail-unpushed" class="text-rail-muted text-sm">Nothing to push</span>

          <!-- Disabled rather than hidden: a control that vanishes teaches
               nothing about what it would have done. Filled once there is
               something to send, outlined and muted at rest — one element
               covers both states via the disabled: variants below. -->
          <button
            id="rail-push"
            type="button"
            disabled
            class="border-rail-active bg-primary-rail text-primary-rail-ink disabled:text-rail-muted mt-0.5 inline-flex h-11 w-full cursor-pointer items-center justify-center gap-2 rounded-sm border text-base font-bold hover:brightness-[1.07] disabled:cursor-not-allowed disabled:bg-transparent"
          >
            Push worklogs
          </button>

          <div class="bg-rail-active my-1 h-0.5 rounded-xs"></div>
        </div>

        <nav class="flex flex-col gap-0.5">
          <a
            href="/today"
            data-route
            class="that-nav flex h-[38px] items-center gap-[11px] rounded-xs px-2.5 text-base"
          >
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.9"
              stroke-linecap="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="8.5" />
              <path d="M12 7.5V12l3 2" />
            </svg>
            Today
          </a>

          <a
            href="/week"
            data-route
            class="that-nav flex h-[38px] items-center gap-[11px] rounded-xs px-2.5 text-base"
          >
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.9"
              stroke-linecap="round"
              aria-hidden="true"
            >
              <rect x="3.5" y="5" width="17" height="15" rx="2.5" />
              <path d="M3.5 10h17M9 5V3M15 5V3" />
            </svg>
            Week
          </a>
        </nav>
      </aside>

      <!--
        The content column, and the container the instance grid measures itself
        against. max-w-3xl used to sit here and is the container scale's 48rem,
        which is the collision the language's decision 8 warns about: a cap is
        an explicit value, and this one is 120rem. The query container is the
        region rather than the capped column, matching the prototype's
        .viewport/.pad pair, so a card grid asks how much room the view has and
        not how much of it the cap is using.
      -->
      <main id="content" class="@container min-w-0 md:min-h-0 md:overflow-y-auto">
        <div class="mx-auto flex max-w-[120rem] flex-col gap-4 px-7 py-6">
          <div id="view"></div>
        </div>
      </main>
    </div>
  </body>
</html>
