<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ThatApp</title>
    <link rel="preload" href="/fonts/chivo-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/chivo-mono-latin.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* An absent data-theme attribute is the auto state, so a failed
         localStorage read lands on following the OS rather than on a guess.
         The order here decides only the no-preference case, and there dark
         wins; a stored preference beats it and so does an OS that expresses
         one. Inlined here, not in styles.css, because the build's minifier
         reorders a two-value color-scheme and reverses that decision — and
         inline survives untouched only ahead of app.css, so that a stored
         preference's [data-theme] override in the stylesheet still wins on
         equal specificity. */
      :root {
        color-scheme: dark light;
      }
    </style>
    <link rel="stylesheet" href="/app.css" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icons/icon.svg" />
    <script type="module" src="/app.js"></script>
    <script>
      // Duplicates two lines of src/theme.ts on purpose: this must run before
      // the module graph loads, so it cannot import them. It only ever
      // overrides — an absent attribute is the auto state, so doing nothing
      // when storage throws is the correct behaviour, not a swallowed bug.
      try {
        let stored = localStorage.getItem("theme");
        if (stored === "light" || stored === "dark") {
          document.documentElement.dataset.theme = stored;
        }
      } catch {}
    </script>
  </head>
  <body class="bg-surface text-ink font-sans text-base tracking-[-0.011em]">
    <div class="grid min-h-screen grid-cols-1 md:grid-cols-[216px_minmax(0,1fr)]">
      <!--
        The rail is the instrument, not a menu: the thing you glance at sits in
        the same place whatever view you are on. It is dark in both themes and
        does not invert.

        This is the first-run board rendered literally. Its regions go live
        later — the total and the split in #7, the timer in #8, the unpushed
        count and Push in #9 — and until then each states its resting condition
        in words rather than vanishing. Nothing shows a value that would be
        wrong once the data exists: with no time entries possible yet the total
        really is zero, there really is nothing to split, no timer is running,
        and there is nothing to push.
      -->
      <aside class="that-rail bg-rail text-rail-ink flex flex-col gap-[30px] px-3.5 py-6">
        <h1 class="text-primary-rail text-xs font-bold tracking-[0.16em] uppercase">
          ThatApp
        </h1>

        <div class="flex flex-col gap-2">
          <!-- Which period the figure below describes. The rail used to mean
               "today" implicitly, which was unambiguous only while Today was the
               one view with time in it. #11 makes it follow the view, and this
               is what keeps the figure honest. -->
          <span
            id="rail-period"
            class="text-rail-muted text-xs font-bold tracking-[0.12em] uppercase"
            >Today</span
          >
          <div id="rail-total" class="that-tnum font-mono text-hero leading-[0.88] font-bold tracking-[-0.035em]">
            0h 00m
          </div>
          <!-- #7 fills this with the split bar and a figure per instance. The
               resting line is inside it rather than replaced by it, so the bar
               is absent — not zero width — until there is something to divide. -->
          <div id="rail-split" class="flex flex-col gap-3">
            <span class="text-rail-muted text-base">Nothing to split yet</span>
          </div>

          <div class="bg-rail-active h-px"></div>

          <!-- #8 makes this the running timer. -->
          <div id="rail-timer" class="flex items-center gap-2">
            <span class="bg-rail-active size-[7px] shrink-0 rounded-full"></span>
            <span class="text-rail-muted text-base">No timer running</span>
          </div>

          <!-- The count of entries not yet pushed, and the control that pushes them. -->
          <span id="rail-unpushed" class="text-rail-muted text-sm">Nothing to push</span>

          <!-- Disabled rather than hidden: a control that vanishes teaches
               nothing about what it would have done. Filled once there is
               something to send, outlined and muted at rest — one element
               covers both states via the disabled: variants below. -->
          <button
            id="rail-push"
            type="button"
            disabled
            class="border-rail-active bg-primary-rail text-primary-rail-ink text-base mt-0.5 inline-flex h-11 w-full cursor-pointer items-center justify-center gap-2 rounded-sm border font-bold hover:brightness-[1.07] disabled:cursor-not-allowed disabled:bg-transparent disabled:text-rail-muted"
          >
            Push to Jira
          </button>
        </div>

        <nav class="flex flex-col gap-0.5">
          <a
            href="/today"
            data-route
            class="that-nav text-base flex h-[38px] items-center gap-[11px] rounded-xs px-2.5"
          >
            <svg
              width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="1.9" stroke-linecap="round" aria-hidden="true"
            >
              <circle cx="12" cy="12" r="8.5" />
              <path d="M12 7.5V12l3 2" />
            </svg>
            Today
          </a>

          <a
            href="/week"
            data-route
            class="that-nav text-base flex h-[38px] items-center gap-[11px] rounded-xs px-2.5"
          >
            <svg
              width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="1.9" stroke-linecap="round" aria-hidden="true"
            >
              <rect x="3.5" y="5" width="17" height="15" rx="2.5" />
              <path d="M3.5 10h17M9 5V3M15 5V3" />
            </svg>
            Week
          </a>

          <a
            href="/settings"
            data-route
            class="that-nav text-base flex h-[38px] items-center gap-[11px] rounded-xs px-2.5"
          >
            <svg
              width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="1.9" stroke-linecap="round" aria-hidden="true"
            >
              <circle cx="12" cy="12" r="3" />
              <path
                d="M12 3.5v2M12 18.5v2M20.5 12h-2M5.5 12h-2M18 6l-1.5 1.5M7.5 16.5 6 18M18 18l-1.5-1.5M7.5 7.5 6 6"
              />
            </svg>
            Settings
          </a>
        </nav>
      </aside>

      <!--
        The content column, and the container the instance grid measures itself
        against. max-w-3xl used to sit here and is the container scale's 48rem,
        which is the collision the language's decision 8 warns about: a cap is
        an explicit value, and this one is 120rem. The query container is the
        region rather than the capped column, matching the prototype's
        .viewport/.pad pair, so a card grid asks how much room the view has and
        not how much of it the cap is using.
      -->
      <main class="@container min-w-0">
        <div class="mx-auto flex max-w-[120rem] flex-col gap-4 px-7 py-6">
          <div id="view"></div>
        </div>
      </main>
    </div>
  </body>
</html>
