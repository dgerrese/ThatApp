name: E2E

# Only when the frontend or the rig itself changes. The rig is more than
# .claude/e2e: the playwright service and the app healthcheck live in
# docker-compose.yml, the target in the Makefile, and the dev image in the root
# Dockerfile. Deliberate trade-off, recorded on #16: pull requests that change
# Go handlers the UI depends on skip this entirely, and their UI needs checking
# by hand.
on:
  pull_request:
    paths:
      - "web/**"
      - ".claude/e2e/**"
      - "docker-compose.yml"
      - "Dockerfile"
      - "Makefile"
      - ".env.example"
      - ".github/workflows/e2e.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".claude/e2e/**"
      - "docker-compose.yml"
      - "Dockerfile"
      - "Makefile"
      - ".env.example"
      - ".github/workflows/e2e.yml"

# The rig image is ~1.8GB and uncached; superseded runs are not worth the wait.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Provide a test environment
        run: |
          cp .env.example .env
          sed -i '/^WD_SECRET_KEY=/d' .env
          printf 'WD_SECRET_KEY=%s\n' "$(head -c 32 /dev/urandom | base64)" >> .env

      # No build-web step: `up -d app` blocks on the web service's healthcheck,
      # and that service installs and builds the frontend itself.
      - name: Start the stack
        run: docker compose up -d app

      - name: Run the end-to-end suite
        run: make test-e2e

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: .claude/e2e/test-results/
